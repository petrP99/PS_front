services:
  ps-front:
    image: ps-front:latest
    container_name: ps-front
    build:
      context: .
    environment:
      BFF_UPSTREAM: ${BFF_UPSTREAM:-http://host.docker.internal:9091}
    ports:
      - "${FRONT_PORT:-5173}:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
