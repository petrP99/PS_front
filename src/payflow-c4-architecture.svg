    <text x="87" y="18" text-anchor="middle" class="edge-label">RestClient · payout</text>
  </g>

  <!-- Kafka bus -->
  <g filter="url(#shadow)">
    <rect x="338" y="648" width="1152" height="108" rx="18" fill="url(#eventFill)" stroke="#6d5a2f" stroke-width="1.4"/>
    <rect x="338" y="648" width="5" height="108" rx="3" fill="#f5c76b"/>
    <text x="364" y="677" class="stereotype">&lt;&lt;EVENT BUS · KAFKA JSON&gt;&gt;</text>
    <text x="364" y="707" class="node-title">Apache Kafka</text>
    <text x="364" y="732" class="node-copy">Async domain workflow</text>

    <g transform="translate(555 671)">
      <rect width="176" height="30" rx="8" fill="#f5c76b" opacity="0.08" stroke="#f5c76b" stroke-opacity="0.2"/>
      <text x="12" y="19" class="topic-name">ps-transfer-execute</text>
      <text x="12" y="45" class="topic-flow">transfer → core</text>
    </g>
    <g transform="translate(742 671)">
      <rect width="168" height="30" rx="8" fill="#f5c76b" opacity="0.08" stroke="#f5c76b" stroke-opacity="0.2"/>
      <text x="12" y="19" class="topic-name">ps-transfer-result</text>
      <text x="12" y="45" class="topic-flow">core → transfer</text>
    </g>
    <g transform="translate(921 671)">
      <rect width="168" height="30" rx="8" fill="#f5c76b" opacity="0.08" stroke="#f5c76b" stroke-opacity="0.2"/>
      <text x="12" y="19" class="topic-name">ps-payment-events</text>
      <text x="12" y="45" class="topic-flow">core → cashback</text>
    </g>
    <g transform="translate(1100 671)">
      <rect width="160" height="30" rx="8" fill="#f5c76b" opacity="0.08" stroke="#f5c76b" stroke-opacity="0.2"/>
      <text x="12" y="19" class="topic-name">ps-notifications</text>
      <text x="12" y="45" class="topic-flow">core → notification</text>
    </g>
    <g transform="translate(1271 671)">
      <rect width="196" height="30" rx="8" fill="#f5c76b" opacity="0.08" stroke="#f5c76b" stroke-opacity="0.2"/>
      <text x="12" y="19" class="topic-name">ps-account-close</text>
      <text x="12" y="45" class="topic-flow">core → core</text>
    </g>
  </g>

  <!-- Kafka directions -->
  <path d="M746 580V648" class="event-line"/>
  <path d="M418 580V648" class="event-line"/>
  <path d="M1074 580V648" class="event-line"/>
  <path d="M1402 580V648" class="event-line"/>

  <!-- Databases -->
  <text x="54" y="840" class="boundary-title">DATA OWNERSHIP</text>

